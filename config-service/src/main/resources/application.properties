spring.application.name=config-service
server.port=9999

# Configuration Git - Repository local (sous-dossier du projet)
spring.cloud.config.server.git.uri=file:///${user.dir}/config-repo
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true

# Alternative: Si vous voulez utiliser le repository complet
# spring.cloud.config.server.git.uri=file:///${user.dir}
# spring.cloud.config.server.git.search-paths=config-repo

# Pour un repo GitHub distant (décommenter si nécessaire)
# spring.cloud.config.server.git.uri=https://github.com/jaouad4/architecture-micro-service
# spring.cloud.config.server.git.search-paths=config-repo
# spring.cloud.config.server.git.default-label=main
